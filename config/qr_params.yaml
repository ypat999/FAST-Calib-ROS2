# Camera intrinsics: 本机 MV-CB013 @ 1280x1024 pinhole
#   数值必须与 Super-LIVO/config/camera_intrinsic.yaml 逐位一致（同源
#   /mnt/dataset/slam_data/calib/camera_intrinsic.yaml），不要手工截断或改写尾数。
fast_calib:
  ros__parameters:
    fx: 708.63125924497740
    fy: 708.71513587278127
    cx: 644.49372682521789
    cy: 495.88359175254533
    k1: 0.054466418090825280
    k2: -0.045147373415016401
    p1: 0.0000085461102120314711
    p2: 0.0010486594840736336

    # Calibration target parameters (official FAST-Calib board: 1.3 m x 0.9 m)
    marker_size: 0.2
    delta_width_qr_center: 0.55
    delta_height_qr_center: 0.35
    delta_width_circles: 0.5
    delta_height_circles: 0.4
    circle_radius: 0.12

    # Distance filter (board only)
    x_min: 1.45
    x_max: 2.00
    y_min: -0.70
    y_max: 0.70
    z_min: 0.86
    z_max: 1.70

    lidar_topic: "/livox/lidar"
    bag_path: "/mnt/dataset/slam_data/calib/all_ros2_pc2"
    image_path: "/mnt/dataset/slam_data/calib/img_0120.png"

    # Multi-shot calibration (optional): when these lists are non-empty they
    # take priority over the single bag_path/image_path above. Each bag is
    # paired with the image at the same index; record each shot statically.
    bag_paths: []
    image_paths: []
    #   - "/path/to/bag1"
    #   - "/path/to/bag2"
    # image_paths:
    #   - "/path/to/img1.png"
    #   - "/path/to/img2.png"

    # Output
    output_path: "/home/ywj/git/Super-LIVO/third_party/FAST-Calib-ROS2/output"

    # Add minimum detected markers parameter
    min_detected_markers: 3
